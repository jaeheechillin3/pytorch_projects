<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">From image patches to an image-level prediction</title><desc id="desc">ViT converts a patch sequence into a contextual class-token representation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">From image patches to an image-level prediction</text><path d="M 220 123 L 250 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 123 L 480 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 123 L 710 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 810 166 L 810 240" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 710 283 L 680 283" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 480 283 L 450 283" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><rect x="20" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="120" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Input image</text><text x="120" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">H × W × C</text><rect x="250" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="350" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Flatten image patches</text><text x="350" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">P × P pixels per patch</text><rect x="480" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Linear projection</text><text x="580" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">N patch embeddings</text><rect x="710" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="810" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Add class token +</text><text x="810" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">positions</text><text x="810" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">N + 1 input tokens</text><rect x="710" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Transformer encoder</text><text x="810" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">global self-attention + MLP</text><rect x="480" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Final class-token state</text><text x="580" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">image representation</text><rect x="250" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="350" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Classification head</text><text x="350" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">class probabilities</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>