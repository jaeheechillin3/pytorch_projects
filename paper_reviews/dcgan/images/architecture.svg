<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">Adversarial learning with convolutional networks</title><desc id="desc">The generator and discriminator learn through the image-generation task.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">Adversarial learning with convolutional networks</text><path d="M 220 123 L 250 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 123 L 480 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 123 L 710 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 283 L 710 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 810 246 L 810 300" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><rect x="20" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="120" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Latent noise</text><text x="120" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">sample z from a prior</text><rect x="250" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="350" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Generator</text><text x="350" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">project + transposed</text><text x="350" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">convolutions</text><rect x="480" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Generated image</text><text x="580" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">64 × 64 output</text><rect x="710" y="160" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Discriminator</text><text x="810" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">strided convolutions</text><rect x="480" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Real image</text><text x="580" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">sample from the dataset</text><rect x="710" y="300" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Real / generated score</text><text x="810" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">adversarial training signal</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>