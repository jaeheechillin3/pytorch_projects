<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">Reparameterization connects the encoder to the reconstruction loss</title><desc id="desc">Independent noise makes latent sampling differentiable with respect to encoder outputs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">Reparameterization connects the encoder to the reconstruction loss</text><path d="M 220 123 L 250 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 123 L 480 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 580 240 L 580 166" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 123 L 710 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 810 166 L 810 240" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 350 166 L 350 240" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><rect x="20" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="120" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Observation x</text><text x="120" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">training example</text><rect x="250" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="350" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Probabilistic encoder</text><text x="350" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">mean μ(x), log variance ℓ(x)</text><rect x="480" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Reparameterized sample</text><text x="580" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">z = μ + exp(ℓ/2) ⊙ ε</text><rect x="710" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="810" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Decoder likelihood</text><text x="810" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">distribution over x</text><rect x="480" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Independent noise</text><text x="580" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">ε drawn from N(0, I)</text><rect x="250" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="350" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Prior KL penalty</text><text x="350" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">q(z|x) versus N(0, I)</text><rect x="710" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Reconstruction term</text><text x="810" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">negative log likelihood</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>