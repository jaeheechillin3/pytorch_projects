<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">A hierarchy of alternating regular and shifted window attention</title><desc id="desc">Patch merging builds the hierarchy; window shifts exchange information within each stage.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">A hierarchy of alternating regular and shifted window attention</text><path d="M 220 123 L 250 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 123 L 480 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="465" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">merge</text><path d="M 680 123 L 710 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="695" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">merge</text><path d="M 810 166 L 810 240" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="810" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">merge</text><path d="M 450 283 L 480 283" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="465" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">alternate</text><path d="M 350 166 L 350 240" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="350" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">inside each stage</text><rect x="20" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="120" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Patch embedding</text><text x="120" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">4 × 4 RGB patches → C</text><rect x="250" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="350" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Stage 1</text><text x="350" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">H/4 × W/4, C channels</text><rect x="480" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Stage 2</text><text x="580" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">H/8 × W/8, 2C channels</text><rect x="710" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="810" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Stage 3</text><text x="810" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">H/16 × W/16, 4C channels</text><rect x="710" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Stage 4</text><text x="810" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">H/32 × W/32, 8C channels</text><rect x="250" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="350" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Regular windows</text><text x="350" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">attention within each</text><text x="350" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">partition</text><rect x="480" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Shifted windows</text><text x="580" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">connect neighboring partitions</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>