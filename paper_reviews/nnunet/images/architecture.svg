<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">Dataset properties determine a complete segmentation pipeline</title><desc id="desc">nnU-Net infers candidate pipelines and uses validation to select the final system.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">Dataset properties determine a complete segmentation pipeline</text><path d="M 220 203 L 250 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 203 L 480 83" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 203 L 480 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 203 L 480 323" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 83 L 710 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 203 L 710 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 323 L 710 203" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 810 246 L 810 300" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><rect x="20" y="160" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="120" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Dataset fingerprint</text><text x="120" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">spacing, shape, modality,</text><text x="120" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">labels</text><rect x="250" y="160" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="350" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Defaults + adaptation</text><text x="350" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">rules</text><text x="350" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">preprocess, topology, patches</text><rect x="480" y="40" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">2D U-Net</text><text x="580" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">slice-based configuration</text><rect x="480" y="160" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">3D U-Net</text><text x="580" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">full-resolution configuration</text><rect x="480" y="280" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">3D cascade</text><text x="580" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">when additional context is</text><text x="580" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">needed</text><rect x="710" y="160" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Cross-validation</text><text x="810" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">configuration / ensemble</text><text x="810" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">selection</text><rect x="710" y="300" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Validated postprocessing</text><text x="810" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">final segmentation pipeline</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>