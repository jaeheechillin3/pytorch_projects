<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc"><title id="title">Only visible patches pass through the expensive encoder</title><desc id="desc">MAE reconstructs masked pixels during pretraining and retains the encoder for recognition.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="940" height="490" fill="#fff"/><text x="470" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172033">Only visible patches pass through the expensive encoder</text><path d="M 220 123 L 250 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 450 123 L 480 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 123 L 710 123" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 810 166 L 810 240" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 710 283 L 680 283" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 480 283 L 450 283" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)"/><path d="M 680 123 C 705 123 705 403 680 403" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="580" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569" stroke="#fff" stroke-width="4" paint-order="stroke">after pretraining</text><rect x="20" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="120" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Image patches</text><text x="120" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">196 patches for 224² / 16²</text><rect x="250" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="350" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Random masking</text><text x="350" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">keep 25% of patches</text><rect x="480" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="580" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">ViT encoder</text><text x="580" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">49 visible patch tokens</text><rect x="710" y="80" width="200" height="86" rx="9" fill="#eff6ff" stroke="#93b5d9" stroke-width="1.2"/><text x="810" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Restore full sequence</text><text x="810" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">add mask tokens + positions</text><rect x="710" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="810" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Lightweight decoder</text><text x="810" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">all patch positions</text><rect x="480" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Patch pixel predictions</text><text x="580" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">linear output projection</text><rect x="250" y="240" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="350" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Reconstruction loss</text><text x="350" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">score only masked patches</text><rect x="480" y="360" width="200" height="86" rx="9" fill="#f5f3ff" stroke="#b7a7d9" stroke-width="1.2"/><text x="580" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">Downstream recognition</text><text x="580" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">encoder uses complete images</text><text x="470" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Architecture schematic based on the paper; minor implementation details omitted.</text></svg>